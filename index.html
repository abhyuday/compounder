<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0e1116" />
<title>Compounder</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --border: #262e3a;
    --text: #e6edf3;
    --muted: #8b98a9;
    --faint: #5c6773;
    --done: #3fb950;
    --done-soft: rgba(63, 185, 80, 0.14);
    --accent: #d9a441;
    --money: #58a6ff;
    --health: #3fb950;
    --family: #db6d9c;
    --self: #a371f7;
    --radius: 14px;
    --shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding: 28px 18px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* Header */
  header { margin-bottom: 22px; }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0;
    display: flex; align-items: center; gap: 9px;
  }
  h1 .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  .date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .tagline { color: var(--faint); font-size: 13px; margin-top: 6px; }

  /* Week bar */
  .week {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .week-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .week-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
  .week-num { font-variant-numeric: tabular-nums; }
  .week-num b { font-size: 22px; font-weight: 700; }
  .week-num .target { color: var(--accent); }
  .week-num .poss { color: var(--faint); font-size: 13px; }

  .track { height: 10px; border-radius: 6px; background: var(--panel-2); position: relative; overflow: hidden; }
  .track .fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(90deg, #2ea043, #3fb950); border-radius: 6px; transition: width .35s ease; }
  .track .goal { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .week-foot { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .week-foot b { color: var(--text); }

  /* Schedule strip */
  .sched { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .sched-now { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; }
  .sched-now .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .sched-now .lbl { font-size: 13.5px; color: var(--text); font-weight: 600; }
  .sched-now .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sched-now .chev { margin-left: auto; color: var(--faint); font-size: 11px; transition: transform .2s ease; }
  .sched.open .sched-now .chev { transform: rotate(180deg); }
  .sched-body { border-top: 1px solid var(--border); padding: 6px; }
  .blk { display: flex; align-items: flex-start; gap: 11px; padding: 9px 10px; border-radius: 9px; }
  .blk.now { background: var(--panel-2); }
  .blk.past { opacity: .42; }
  .blk .bt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; width: 66px; flex: 0 0 auto; padding-top: 2px; }
  .blk .bdot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; background: var(--faint); }
  .blk .bmain { min-width: 0; }
  .blk .blabel { display: block; font-size: 13.5px; color: var(--text); font-weight: 600; }
  .blk .bnote { display: block; font-size: 12px; color: var(--muted); }
  .sched-actions { display: flex; gap: 14px; padding: 8px 12px 6px; }
  .sched-actions .lnk { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; }
  .sched-actions .lnk.muted { color: var(--muted); }
  .blk.edit { align-items: center; gap: 6px; flex-wrap: wrap; }
  .sched input { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 6px 8px; font-size: 12.5px; outline: none; }
  .sched input:focus { border-color: var(--accent); }
  .blk.edit input[type=time] { width: 108px; flex: 0 0 auto; }
  .blk.edit .blabel-in { width: 118px; flex: 0 0 auto; }
  .blk.edit .bnote-in { flex: 1; min-width: 120px; }
  .blk .del { background: none; border: none; color: #db6d6d; cursor: pointer; font-size: 13px; flex: 0 0 auto; }

  /* Bookend ritual */
  .bookend { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .bookend-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
  .bookend-top .ttl { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .bookend-streak { font-size: 12px; color: var(--accent); }
  .be-section { margin-bottom: 16px; }
  .be-section:last-child { margin-bottom: 0; }
  .be-section.dim { opacity: .55; }
  .be-row { margin-bottom: 11px; }
  .be-row:last-child { margin-bottom: 0; }
  .be-q { font-size: 13.5px; color: var(--text); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .be-q .qdot { width: 8px; height: 8px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); flex: 0 0 auto; }
  .be-q .qdot.on { background: var(--done); border-color: var(--done); box-shadow: 0 0 8px rgba(63,185,80,.5); }
  .be-recall { font-size: 12px; color: var(--muted); font-style: italic; margin: 0 0 6px 16px; }
  .bookend textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 9px 11px; font-size: 14px; font-family: inherit; line-height: 1.4; resize: none; overflow: hidden; outline: none; }
  .bookend textarea:focus { border-color: var(--accent); }
  .be-toggle { display: flex; align-items: center; gap: 11px; cursor: pointer; padding: 9px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); transition: border-color .15s ease, background .15s ease; }
  .be-toggle:hover { border-color: #33404f; }
  .be-toggle.on { background: var(--done-soft); border-color: rgba(63,185,80,0.4); }
  .be-box { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); background: var(--panel); display: grid; place-items: center; transition: all .15s ease; }
  .be-toggle.on .be-box { background: var(--done); border-color: var(--done); }
  .be-box svg { width: 13px; height: 13px; stroke: #0e1116; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.6); transition: all .15s ease; }
  .be-toggle.on .be-box svg { opacity: 1; transform: scale(1); }
  .be-label { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .bookend .notewrap { margin-top: 7px; padding-left: 44px; }

  /* Day switcher */
  .dayswitch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .daynav {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 13px;
    display: grid; place-items: center; transition: all .15s ease; flex: 0 0 auto;
  }
  .daynav:hover:not(:disabled) { color: var(--text); border-color: #33404f; }
  .daynav:disabled { opacity: .32; cursor: default; }
  .daymid { text-align: center; line-height: 1.25; }
  .daylabel { font-size: 15px; font-weight: 600; color: var(--text); }
  .daytoday { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 1px 0 0; }
  .daytoday.hidden { display: none; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); user-select: none;
    transition: border-color .18s ease, background .18s ease;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--dc); opacity: .85;
  }
  .card[data-domain="money"]  { --dc: var(--money); }
  .card[data-domain="health"] { --dc: var(--health); }
  .card[data-domain="family"] { --dc: var(--family); }
  .card[data-domain="self"]   { --dc: var(--self); }

  .card.done { background: linear-gradient(0deg, var(--done-soft), var(--done-soft)), var(--panel); border-color: rgba(63,185,80,0.4); }

  .card-head { display: flex; align-items: center; gap: 12px; }
  .check {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid var(--border); background: var(--panel-2);
    display: grid; place-items: center; transition: all .18s ease;
  }
  .card.done .check { background: var(--done); border-color: var(--done); }
  .check svg { width: 15px; height: 15px; stroke: #0e1116; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.6); transition: all .18s ease; }
  .card.done .check svg { opacity: 1; transform: scale(1); }

  .domain { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dc); font-weight: 600; }
  .scored { font-size: 12px; color: var(--faint); margin-top: 9px; }
  .card.done .scored { color: var(--muted); }
  .flex-title { flex: 1; }
  .status { font-size: 12.5px; font-weight: 600; color: var(--faint); white-space: nowrap; }
  .card.done .status { color: var(--done); }

  /* Today score */
  .today {
    margin: 22px 0 8px; display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; color: var(--muted);
  }
  .today b { color: var(--text); font-size: 15px; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); }
  .pip.on { background: var(--done); border-color: var(--done); box-shadow: 0 0 8px rgba(63,185,80,.5); }

  /* Week grid */
  .grid-wrap { margin-top: 30px; }
  .grid-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .navbtn { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  .navbtn:hover { color: var(--text); }
  .navbtn:disabled { opacity: .4; cursor: default; }
  .grid { width: 100%; border-collapse: collapse; font-size: 12px; }
  .grid th { font-weight: 500; color: var(--faint); text-align: center; padding: 6px 2px; font-variant-numeric: tabular-nums; }
  .grid th.rowh { text-align: left; width: 66px; }
  .grid td { text-align: center; padding: 5px 2px; }
  .grid td.rowh { text-align: left; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  .cell { width: 15px; height: 15px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); display: inline-block; }
  .cell.on { border: none; }
  .cell.on[data-d="money"]  { background: var(--money); }
  .cell.on[data-d="health"] { background: var(--health); }
  .cell.on[data-d="family"] { background: var(--family); }
  .cell.on[data-d="self"]   { background: var(--self); }
  .cell.editable { cursor: pointer; }
  .cell.editable:hover { outline: 2px solid rgba(139,152,169,0.55); outline-offset: 1px; }
  .cell.future { opacity: .4; }
  .grid td.sel-col { background: rgba(88,166,255,0.10); border-radius: 4px; }
  .grid th.sel-col { color: var(--money); }
  .hcell { display: inline-flex; gap: 1px; align-items: center; justify-content: center; }
  .hcell.selectday { cursor: pointer; }
  .hcell.future { opacity: .4; }
  .hseg { width: 3px; height: 14px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--border); }
  .hcell[data-domain="health"] .hseg.on { background: var(--health); border-color: var(--health); }
  .hcell[data-domain="self"] .hseg.on { background: var(--self); border-color: var(--self); }
  .hcell.selectday:hover .hseg { border-color: #4a5a6b; }

  /* Sub-toggle cards (Health, Self) */
  .subs-card .card-head { align-items: center; }
  .status.perfect { color: var(--accent) !important; }
  .subs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .sub {
    display: flex; align-items: center; gap: 11px; cursor: pointer; padding: 9px 11px;
    border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border);
    transition: border-color .15s ease, background .15s ease;
  }
  .sub:hover { border-color: #33404f; }
  .sub.on { background: var(--done-soft); border-color: rgba(63,185,80,0.4); }
  .subcheck {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border);
    background: var(--panel); display: grid; place-items: center; transition: all .15s ease;
  }
  .sub.on .subcheck { background: var(--done); border-color: var(--done); }
  .subcheck svg { width: 13px; height: 13px; stroke: #0e1116; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.6); transition: all .15s ease; }
  .sub.on .subcheck svg { opacity: 1; transform: scale(1); }
  .subtext { display: flex; flex-direction: column; line-height: 1.25; }
  .subname { font-size: 14px; font-weight: 600; color: var(--text); }
  .subhint { font-size: 12px; color: var(--muted); }
  .submove { font-size: 13.5px; color: var(--text); line-height: 1.4; }

  /* Per-item notes (non-intrusive) */
  .notewrap { margin-top: 5px; }
  .note-add { background: none; border: none; color: var(--faint); font-size: 11.5px; cursor: pointer; padding: 1px 0; }
  .note-add:hover { color: var(--muted); }
  .note-line { font-size: 12px; color: var(--muted); font-style: italic; cursor: text; }
  .note-line::before { content: "\201C"; }
  .note-line::after { content: "\201D"; }
  .note-input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; font-size: 13px; font-family: inherit; outline: none; }
  .note-input:focus { border-color: var(--accent); }
  .grid tr.total td { padding-top: 9px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .grid tr.total td.tt { font-weight: 700; color: var(--text); }
  .grid td.today-col { background: rgba(217,164,65,0.07); border-radius: 4px; }
  .grid th.today-col { color: var(--accent); }

  footer { margin-top: 40px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
  footer .big { color: var(--muted); }

  /* Sync / auth */
  .syncrow { display: flex; justify-content: flex-end; margin: -6px 0 18px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; transition: all .15s ease;
  }
  .pill:hover { color: var(--text); border-color: #33404f; }
  .pill .st { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.synced { color: var(--done); border-color: rgba(63,185,80,0.35); }
  .pill.synced .st { background: var(--done); box-shadow: 0 0 8px rgba(63,185,80,.5); }
  .pill.busy .st { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pill.err .st { background: #db6d6d; }

  .auth-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin: 0 0 20px; box-shadow: var(--shadow); display: none;
  }
  .auth-panel.open { display: block; }
  .auth-panel h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .auth-panel p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .auth-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .auth-panel input[type=email] {
    flex: 1; min-width: 180px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  .auth-panel input[type=email]:focus { border-color: var(--money); }
  .btn {
    background: var(--accent); color: #241a04; border: none; border-radius: 9px;
    padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
  .btn.ghost:hover { color: var(--text); }
  .auth-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .auth-msg.ok { color: var(--done); }
  .auth-msg.bad { color: #e08a8a; }
  .auth-who { font-size: 13px; color: var(--muted); }
  .auth-who b { color: var(--text); }

  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #1f2328; border: 1px solid #d0d7de; border-radius: 10px;
    padding: 11px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s ease;
  }
  .btn-google:hover { filter: brightness(0.97); }
  .btn-google svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .divider {
    display: flex; align-items: center; gap: 12px; color: var(--faint);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .pill-av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .profile { display: flex; align-items: center; gap: 13px; }
  .who-av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
  .who-av.ph { display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-weight: 700; font-size: 18px; }
  .who-meta { min-width: 0; }
  .who-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .who-email { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="dot"></span>Compounder</h1>
      <span class="date" id="date"></span>
    </div>
    <div class="tagline">Four points a day. Target is 20 a week — not 28. That number is the whole system.</div>
  </header>

  <div class="syncrow">
    <span class="pill" id="syncPill"><span class="st"></span><span id="syncText">Sync across devices</span></span>
  </div>

  <section class="auth-panel" id="authPanel"></section>

  <section class="sched" id="sched"></section>

  <section class="week">
    <div class="week-top">
      <span class="week-label" id="weekLabel">This week</span>
      <span class="week-num"><b id="weekPts">0</b><span class="poss"> / <span class="target">20 target</span> · 28 possible</span></span>
    </div>
    <div class="track">
      <div class="fill" id="weekFill" style="width:0%"></div>
      <div class="goal" id="weekGoal"></div>
    </div>
    <div class="week-foot" id="weekFoot"></div>
  </section>

  <section class="bookend" id="bookend"></section>

  <div class="dayswitch">
    <button class="daynav" id="dayPrev" aria-label="Previous day">◀</button>
    <div class="daymid">
      <div class="daylabel" id="dayLabel">Today</div>
      <button class="daytoday hidden" id="dayToday">Jump to today</button>
    </div>
    <button class="daynav" id="dayNext" aria-label="Next day">▶</button>
  </div>

  <section class="cards" id="cards"></section>

  <div class="today">
    <span><span id="scoreLabel">Today</span> — <b id="todayScore">0</b> of 4</span>
    <span class="pips" id="pips"></span>
  </div>

  <section class="grid-wrap">
    <div class="grid-title">
      <button class="navbtn" id="prevWeek">← prev</button>
      <span id="gridRange"></span>
      <button class="navbtn" id="nextWeek">next →</button>
    </div>
    <table class="grid" id="grid"></table>
  </section>

  <footer>
    <div class="big">A bad week is 20. A perfect week is a trap.</div>
    <div>Signed in, your board syncs across every device.</div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var STORE = "compounder.v1";
  var TARGET = 20;

    host.innerHTML = now + body;
  }

  // ======================= Bookend ritual (morning/evening questions) =======================
  function bookendDone(e) { return !!(e && e.hard); }
  function bookendStreak() {
    var d = new Date(today);
    if (!(data[ymd(d)] && bookendDone(data[ymd(d)]))) d = addDays(d, -1); // today not done yet → count up to yesterday
    var n = 0;
    for (;;) { var e = data[ymd(d)]; if (e && bookendDone(e)) { n++; d = addDays(d, -1); } else break; }
    return n;
  }
  function updateBookendMeta() {
    var el = document.getElementById("beStreak");
    if (el) { var n = bookendStreak(); el.textContent = n > 0 ? (n + "-day streak") : ""; }
  }
  function autosize(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight) + "px"; }
  function beBlock(field, question, placeholder, val) {
    return '<div class="be-row">' +
        '<div class="be-q"><span class="qdot' + (val.trim() ? " on" : "") + '"></span>' + question + '</div>' +
        '<textarea data-field="' + field + '" rows="1" placeholder="' + placeholder + '">' + escapeHtml(val) + '</textarea>' +
      '</div>';
  }
  function renderBookend() {
    var host = document.getElementById("bookend");
    // Don't rebuild while the note is being typed (would steal focus).
    if (document.activeElement && host.contains(document.activeElement) && document.activeElement.closest("[data-noteinput]")) return;
    var e = dayEntry(selectedKey);
    host.innerHTML =
      '<div class="bookend-top"><span class="ttl">Daily bookend</span><span class="bookend-streak" id="beStreak"></span></div>' +
      '<div class="be-toggle' + (e.hard ? " on" : "") + '" data-hard>' +
        '<span class="be-box">' + checkSVG + '</span>' +
        '<span class="be-label">What hard thing shall I do this day?</span>' +
      '</div>' +
      noteZone("hard", e);
    updateBookendMeta();
  }

  function renderAll() {
    renderDaySwitch();
    if (!noteInputFocused()) renderCards(); // don't steal focus while a note is being typed
    renderToday();
    renderWeekBar();
    renderGrid();
    if (!schedEditing) renderSchedule();
    renderBookend();
  }

  // Schedule interactions (delegated on the stable container).
  document.getElementById("sched").addEventListener("click", function (ev) {
    var act = ev.target.closest && ev.target.closest("[data-act]");
    if (!act) return;
    var a = act.getAttribute("data-act");
    if (a === "toggle") { if (!schedEditing) { schedOpen = !schedOpen; renderSchedule(); } return; }
    if (a === "edit")  { schedEditing = true; schedOpen = true; renderSchedule(); return; }
    if (a === "add")   { schedule = readEdits(); schedule.push({ start: "12:00", label: "New block", note: "", dom: "" }); renderSchedule(); return; }
    if (a === "del")   { var row = act.closest(".blk"); var i = +row.getAttribute("data-idx"); var arr = readEdits(); arr.splice(i, 1); schedule = arr; renderSchedule(); return; }
    if (a === "reset") { schedule = loadDefaultSched(); sortSched(); saveSched(schedule); schedEditing = false; renderSchedule(); return; }
    if (a === "save")  { schedule = readEdits(); sortSched(); saveSched(schedule); schedEditing = false; renderSchedule(); return; }
  });
  function loadDefaultSched() { return DEFAULT_SCHED.map(function (b) { return { start: b.start, label: b.label, note: b.note, dom: b.dom }; }); }

  // Bookend interactions: update live on input (no rebuild → keeps focus), sync on blur.
  document.getElementById("bookend").addEventListener("input", function (ev) {
    var t = ev.target; if (t.tagName !== "TEXTAREA") return;
    var e = dayEntry(selectedKey);
    e[t.getAttribute("data-field")] = t.value;
    e.updated_at = Date.now();
    data[selectedKey] = e;
    save(data);
    var dot = t.parentNode.querySelector(".qdot"); if (dot) dot.classList.toggle("on", !!t.value.trim());
    autosize(t);
    updateBookendMeta();
  });
  document.getElementById("bookend").addEventListener("focusout", function (ev) {
    if (ev.target.tagName === "TEXTAREA") pushDay(selectedKey);
  });
  // The hard-thing yes/no toggle + its note.
  function openBookendNote(key) {
    noteEditing = key;
    renderBookend();
    var inp = document.getElementById("bookend").querySelector('[data-noteinput="' + key + '"]');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  document.getElementById("bookend").addEventListener("click", function (ev) {
    var noteBtn = ev.target.closest && ev.target.closest("[data-note]");
    if (noteBtn) { openBookendNote(noteBtn.getAttribute("data-note")); return; }
    if (ev.target.closest && ev.target.closest("[data-hard]")) {
      var e = dayEntry(selectedKey);
      e.hard = !e.hard; e.updated_at = Date.now();
      data[selectedKey] = e; save(data); pushDay(selectedKey);
      renderBookend();
    }
  });
  document.getElementById("bookend").addEventListener("input", function (ev) {
    var inp = ev.target.closest && ev.target.closest("[data-noteinput]"); if (!inp) return;
    var en = dayEntry(selectedKey); en.notes = en.notes || {}; en.notes[inp.getAttribute("data-noteinput")] = inp.value;
    en.updated_at = Date.now(); data[selectedKey] = en; save(data);
  });
  document.getElementById("bookend").addEventListener("focusout", function (ev) {
    if (!(ev.target.closest && ev.target.closest("[data-noteinput]"))) return;
    pushDay(selectedKey);
    var closingKey = noteEditing;
    setTimeout(function () { if (noteEditing === closingKey) { noteEditing = null; renderBookend(); } }, 0);
  });
  document.getElementById("bookend").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.closest && ev.target.closest("[data-noteinput]")) ev.target.blur();
  });

  // Keep the "Now" block and bookend phase current through the day.
  setInterval(function () { if (!schedEditing) renderSchedule(); renderBookend(); }, 60000);

  // Day switcher controls.
  document.getElementById("dayPrev").addEventListener("click", function () {
    selectDay(ymd(addDays(parseKey(selectedKey), -1)));
  });
  document.getElementById("dayNext").addEventListener("click", function () {
    if (selectedKey !== todayKey) selectDay(ymd(addDays(parseKey(selectedKey), 1)));
  });
  document.getElementById("dayToday").addEventListener("click", function () {
    selectDay(todayKey);
  });

  // Direct back-fill: click any editable grid cell to toggle that day/domain.
  // Health is three sub-parts, so its cell opens the day in the cards instead.
  document.getElementById("grid").addEventListener("click", function (ev) {
    if (!ev.target.closest) return;
    var cell = ev.target.closest(".cell.editable");
    if (cell) { setDomain(cell.getAttribute("data-day"), cell.getAttribute("data-d")); return; }
    var hcell = ev.target.closest(".hcell.selectday");
    if (hcell) selectDay(hcell.getAttribute("data-day"));
  });

  document.getElementById("prevWeek").addEventListener("click", function () {
    viewMonday = addDays(viewMonday, -7); renderGrid();
  });
  document.getElementById("nextWeek").addEventListener("click", function () {
    if (ymd(viewMonday) === ymd(thisMonday)) return;
    viewMonday = addDays(viewMonday, 7); renderGrid();
  });

  // If the app was left open past midnight, refresh "today" on focus.
  window.addEventListener("focus", function () {
    var nk = ymd(new Date());
    if (nk !== todayKey) { location.reload(); return; }
    if (session) { sync(); syncSchedule(); } // pull any changes made on other devices
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && session) { sync(); syncSchedule(); }
  });

  // ======================= Supabase auth + sync =======================
  var session = null;          // current auth session, or null
  var syncing = false;

  var pillEl = document.getElementById("syncPill");
  var syncTextEl = document.getElementById("syncText");
  var panelEl = document.getElementById("authPanel");

  function meta() { return (session && session.user && session.user.user_metadata) || {}; }
  function userName() { var m = meta(); return m.full_name || m.name || (session && session.user.email) || "Signed in"; }
  function firstName() { return userName().split(" ")[0].split("@")[0]; }
  function userAvatar() { var m = meta(); return m.avatar_url || m.picture || ""; }

  function setPill(state, text) {
    pillEl.className = "pill" + (state ? " " + state : "");
    pillEl.title = text || "";
    if (session) {
      var av = userAvatar();
      pillEl.innerHTML =
        '<span class="st"></span>' +
        (av ? '<img class="pill-av" src="' + escapeHtml(av) + '" referrerpolicy="no-referrer" alt="">' : "") +
        '<span>' + escapeHtml(firstName()) + "</span>";
    } else {
      pillEl.innerHTML = '<span class="st"></span><span>' + escapeHtml(text || "Sync across devices") + "</span>";
    }
  }

  // Toggle the auth panel open/closed when the pill is clicked.
  pillEl.addEventListener("click", function () {
    if (!sb) return;
    panelEl.classList.toggle("open");
    if (panelEl.classList.contains("open")) renderAuthPanel();
  });

  var googleLogoSVG =
    '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">' +
    '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
    '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
    '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
    '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
    '</svg>';

  function signInGoogle() {
    if (!sb) return;
    var redirect = location.origin + location.pathname;
    setPill("busy", "Redirecting…");
    sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: redirect, queryParams: { prompt: "select_account" } } })
      .then(function (res) { if (res.error) authMsg(res.error.message, "bad"); })
      .catch(function (err) { authMsg(String(err && err.message || err), "bad"); });
  }

  function renderAuthPanel() {
    if (session) {
      var av = userAvatar();
      var name = escapeHtml(userName());
      var email = escapeHtml(session.user.email || "");
      panelEl.innerHTML =
        '<div class="profile">' +
          (av
            ? '<img class="who-av" src="' + escapeHtml(av) + '" referrerpolicy="no-referrer" alt="">'
            : '<div class="who-av ph">' + escapeHtml((userName()[0] || "?").toUpperCase()) + '</div>') +
          '<div class="who-meta">' +
            '<div class="who-name">' + name + '</div>' +
            (email && email !== name ? '<div class="who-email">' + email + '</div>' : "") +
          '</div>' +
        '</div>' +
        '<div class="auth-msg ok" id="authMsg">Synced to your account on every device you sign in on.</div>' +
        '<div class="auth-row" style="margin-top:14px">' +
          '<button class="btn ghost" id="switchBtn">Switch account</button>' +
          '<button class="btn ghost" id="signOutBtn">Sign out</button>' +
        '</div>';
      document.getElementById("signOutBtn").addEventListener("click", function () { doSignOut(false); });
      document.getElementById("switchBtn").addEventListener("click", switchAccount);
    } else {
      panelEl.innerHTML =
        '<h3>Sync across devices</h3>' +
        '<p>Sign in to see the same board on every device.</p>' +
        '<button class="btn-google" id="googleBtn">' + googleLogoSVG + 'Continue with Google</button>' +
        '<div class="divider">or with email</div>' +
        '<div class="auth-row">' +
          '<input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" />' +
          '<button class="btn" id="sendLinkBtn">Email me a link</button>' +
        '</div>' +
        '<div class="auth-msg" id="authMsg"></div>';
      document.getElementById("googleBtn").addEventListener("click", signInGoogle);
      var input = document.getElementById("emailInput");
      var btn = document.getElementById("sendLinkBtn");
      btn.addEventListener("click", function () { sendLink(input.value.trim(), btn); });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") sendLink(input.value.trim(), btn); });
    }
  }

  function authMsg(text, kind) {
    var m = document.getElementById("authMsg");
    if (m) { m.textContent = text; m.className = "auth-msg" + (kind ? " " + kind : ""); }
  }

  function sendLink(email, btn) {
    if (!sb) return;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { authMsg("Enter a valid email address.", "bad"); return; }
    btn.disabled = true;
    authMsg("Sending…");
    var redirect = location.origin + location.pathname;
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirect } })
      .then(function (res) {
        btn.disabled = false;
        if (res.error) { authMsg(res.error.message, "bad"); }
        else { authMsg("Check " + email + " for a login link, then open it on this device.", "ok"); }
      })
      .catch(function (err) { btn.disabled = false; authMsg(String(err && err.message || err), "bad"); });
  }

  function doSignOut(keepPanelOpen) {
    if (!sb) return;
    sb.auth.signOut().then(function () {
      // onAuth(null) fires and reloads the (empty) signed-out board.
      if (keepPanelOpen) { panelEl.classList.add("open"); renderAuthPanel(); }
      else panelEl.classList.remove("open");
    });
  }

  // Sign out and immediately reopen the login panel to log in as someone else.
  function switchAccount() { doSignOut(true); }

  // ---- sync engine (last-write-wins per day) ----
  function entryFromRow(r) {
    var e = {
      money: !!r.money, family: !!r.family,
      hmove: !!r.hmove, heat: !!r.heat, hsleep: !!r.hsleep,
      vind: !!r.vind, vsin: !!r.vsin, vtrq: !!r.vtrq, vrest: !!r.vrest,
      am_intent: r.am_intent || "", pm_review: r.pm_review || "", hard: !!r.hard,
      notes: r.notes || {},
      updated_at: r.updated_at ? Date.parse(r.updated_at) : 0
    };
    e.health = healthDone(e);
    // Fallback if the vrest backfill hasn't run: an old restoration point (self=true)
    // with no virtues becomes the Restoration toggle.
    if (!e.vrest && !!r.self && !e.vind && !e.vsin && !e.vtrq) e.vrest = true;
    e.self = selfDone(e);
    return e;
  }
  function rowFromEntry(day, e) {
    return {
      user_id: session.user.id, day: day,
      money: !!e.money, family: !!e.family,
      hmove: !!e.hmove, heat: !!e.heat, hsleep: !!e.hsleep, health: healthDone(e),
      vind: !!e.vind, vsin: !!e.vsin, vtrq: !!e.vtrq, vrest: !!e.vrest, self: selfDone(e),
      am_intent: e.am_intent || "", pm_review: e.pm_review || "", hard: !!e.hard,
      notes: e.notes || {},
      updated_at: new Date(e.updated_at || Date.now()).toISOString()
    };
  }
  function hasNotes(e) {
    return !!(e && e.notes && Object.keys(e.notes).some(function (k) { return e.notes[k] && String(e.notes[k]).trim(); }));
  }
  function hasData(e) {
    return !!(e && (e.money || e.hmove || e.heat || e.hsleep || e.family || e.vind || e.vsin || e.vtrq || e.vrest ||
      (e.am_intent && e.am_intent.trim()) || (e.pm_review && e.pm_review.trim()) || e.hard || hasNotes(e)));
  }

  function pushDay(day) {
    if (!sb || !session) return;
    var e = data[day]; if (!e) return;
    sb.from("days").upsert(rowFromEntry(day, e), { onConflict: "user_id,day" })
      .then(function (res) {
        if (res.error) setPill("err", "Sync error");
        else if (!syncing) setPill("synced", "Synced");
      })
      .catch(function () { setPill("err", "Offline"); });
  }

  function sync() {
    if (!sb || !session || syncing) return;
    syncing = true;
    setPill("busy", "Syncing…");
    sb.from("days").select("day,money,health,family,self,hmove,heat,hsleep,vind,vsin,vtrq,vrest,am_intent,pm_review,hard,notes,updated_at")
      .then(function (res) {
        if (res.error) { setPill("err", "Sync error"); syncing = false; return; }
        var remote = {};
        (res.data || []).forEach(function (r) { remote[r.day] = entryFromRow(r); });

        var days = {};
        Object.keys(data).forEach(function (d) { days[d] = 1; });
        Object.keys(remote).forEach(function (d) { days[d] = 1; });

        var toPush = [];
        Object.keys(days).forEach(function (d) {
          var l = data[d], r = remote[d];
          var lu = (l && l.updated_at) || 0;
          var ru = (r && r.updated_at) || 0;
          if (lu > ru) {
            if (hasData(l) || r) toPush.push(rowFromEntry(d, l)); // send local-newer up
          } else if (ru > lu) {
            data[d] = r; // pull remote-newer down
          }
        });
        save(data);
        renderAll();

        if (toPush.length) {
          sb.from("days").upsert(toPush, { onConflict: "user_id,day" })
            .then(function (r2) {
              syncing = false;
              setPill(r2.error ? "err" : "synced", r2.error ? "Sync error" : "Synced");
            })
            .catch(function () { syncing = false; setPill("err", "Offline"); });
        } else {
          syncing = false;
          setPill("synced", "Synced");
        }
      })
      .catch(function () { syncing = false; setPill("err", "Offline"); });
  }

  // One-time: when the very first account signs in on this device, adopt the
  // pre-account (signed-out) board into it, then retire the anon copy so it can
  // never leak into a different account later.
  function claimAnonBoard() {
    if (localStorage.getItem(MIGRATED_KEY)) return;
    var anon = normalize(loadKey(ANON_KEY));
    var moved = false;
    Object.keys(anon).forEach(function (d) {
      if (!hasData(anon[d])) return;
      var cur = data[d];
      if (!cur || (anon[d].updated_at || 0) > (cur.updated_at || 0)) { data[d] = anon[d]; moved = true; }
    });
    localStorage.setItem(MIGRATED_KEY, session.user.id);
    localStorage.removeItem(ANON_KEY);
    if (moved) save(data);
  }

  function onAuth(newSession) {
    session = newSession || null;
    data = load(); // reload the board for the now-current scope (this user, or anon)
    onAuthSchedule(); // reload + reconcile the schedule for this account
    if (session) {
      claimAnonBoard();
      setPill("busy", "Syncing…");
      renderAll();
      sync();
    } else {
      setPill("", "Sync across devices");
      renderAll();
    }
    if (panelEl.classList.contains("open")) renderAuthPanel();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  if (sb) {
    sb.auth.getSession().then(function (res) { onAuth(res.data && res.data.session); });
    sb.auth.onAuthStateChange(function (_evt, s) { onAuth(s); });
  } else {
    setPill("err", "Sync unavailable");
  }

  renderAll();
})();
</script>
</body>
